# ============================================================
# TG Radar — конфигурация
# Секреты здесь НЕ хранятся, они в .env (см. .env.example)
# ============================================================

# Имя файла сессии Telethon. Создаётся при первой авторизации,
# лежит рядом с main.py, в git не попадает (см. .gitignore).
session_name: tg-radar

# Путь к файлу базы SQLite. Дедуп, очередь pending и таблица лидов.
db_path: radar.db

# Уровень логирования: DEBUG | INFO | WARNING | ERROR
# DEBUG — печатает решение фильтра по каждому сообщению.
log_level: INFO

# ------------------------------------------------------------
# Чаты, которые слушаем. Вписывать вручную — бот никуда не вступает сам.
# Допустимые формы записи:
#   - '@publicchatname'      публичный чат по username
#   - -1001234567890         числовой id супергруппы/канала
# Пустой список = слушаем ничего.
# ------------------------------------------------------------
chats:
  - '@example_business_chat'

# ------------------------------------------------------------
# Прокси
# ------------------------------------------------------------

# Gemini API не отвечает с российских IP.
# Формат: http://user:pass@host:port (или http://host:port без авторизации).
# Если заполнено — HTTPS_PROXY выставляется в окружении процесса
# ДО создания клиента Gemini. Пусто — работаем напрямую.
gemini_proxy: ''

# Прокси для Telethon. Необязателен, по умолчанию пусто.
# Формат MTProto:  mtproto://host:port:secret
# Формат SOCKS5:   socks5://user:pass@host:port
telegram_proxy: ''

# ------------------------------------------------------------
# Префильтр — локальный, без сети и без денег
# ------------------------------------------------------------

# Сообщения короче этого числа символов отбрасываются сразу.
min_message_length: 15

# Ключевые слова. При загрузке сами прогоняются через normalize(),
# поэтому писать их можно как угодно — с ё, с эмодзи, в любом регистре.
# Ищутся как подстроки в нормализованном тексте, одного совпадения
# достаточно, чтобы сообщение пошло в Gemini.
keywords:
  - автоматиз           # стем: покрывает и «автоматизировать», и «автоматизацию»
  - чат-бот
  - чат бот           # раздельное написание
  - чатбот
  - телеграм бот
  - телеграмм бот       # частая опечатка с двумя м
  - telegram bot
  - нужен бот
  - свой бот
  - бот для прием
  - бота для прием    # первое слово ключа тоже склоняется
  - бот для заказ
  - бота для заказ
  - бот для бизнес
  - бота для бизнес
  - нужен разработчик
  - ищу разработчик
  - кто делает бот
  - прием заяв
  - приема заяв
  - прием заказ
  - приема заказ
  - заявки теря
  - заказы в вотсап
  - заявки в вотсап
  - заказы в ватсап
  - заказы в whatsapp
  - гугл таблиц
  - google sheets
  - црм
  - crm

# Стоп-слова: явная реклама услуг. Совпадение любого — сообщение
# отбрасывается до вызова Gemini, даже если ключевое слово нашлось.
# Тоже прогоняются через normalize() при загрузке.
stop_words:
  - мой канал
  - подписывайтесь
  - прайс в лс

# ------------------------------------------------------------
# Gemini
# ------------------------------------------------------------

# Модель. Менять только на модель с поддержкой structured output.
gemini_model: gemini-2.5-flash

# Потолок вызовов Gemini в час. Превышен — сообщение кладётся
# в SQLite со статусом pending и разбирается в следующем часу.
max_gemini_calls_per_hour: 200

# Порог уведомления: лид с score ниже этого числа только пишется в базу,
# уведомление в Saved Messages не уходит.
min_score: 60

# Системный промпт для Gemini. Правится свободно, перечитывается при старте.
gemini_system_prompt: |
  Ты фильтр лидов. Тебе дают сообщение из делового Telegram-чата.
  Задача: понять, есть ли у автора проблема, которую решает чат-бот
  приёма заказов для оптовой компании (заявки по телефону, заказы
  в переписке, менеджер не успевает, ручной перенос в таблицу),
  или автор прямо ищет разработчика бота.
  Оценивай ТОЛЬКО переданный текст. Не додумывай контекст, которого нет.
  is_lead = true только если автор говорит о СВОЕЙ проблеме или СВОЁМ поиске.
  Чужие вопросы, новости, реклама, шутки — is_lead = false.
  Отвечай ТОЛЬКО валидным JSON по заданной схеме. Без markdown, без пояснений.
